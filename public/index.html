<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento PIX</title>

  <!-- CSS -->
  <link href="bootstrap.min.css" rel="stylesheet">
  <link href="signin.css" rel="stylesheet">

  <!-- JS -->
  <script src="jquery-3.6.4.min.js"></script>
  <script src="qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 10px;
    }

    .container-pagamento {
      max-width: 500px;
      margin: 0 auto;
      padding: 10px;
    }

    #qrcode canvas,
    #qrcode img {
      width: 100% !important;
      max-width: 280px;
      height: auto !important;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-size: 12px;
      resize: none;
    }

    button {
      width: 100%;
      max-width: 200px;
    }

    h3 {
      font-size: 20px;
    }

    /* CONTADOR */
    .contador {
      font-size: 28px;
      font-weight: bold;
      color: green;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      h3 {
        font-size: 18px;
      }

      #qrcode canvas,
      #qrcode img {
        max-width: 220px;
      }

      textarea {
        font-size: 11px;
      }

      img {
        max-width: 70px;
      }
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div id="loading" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF;z-index:9999;padding-top:20px;">
  <img src="Loading_icon.gif" style="width:200px;">
</div>

<!-- CONTAINER -->
<div class="container-pagamento">

  <!-- INFO -->
  <div id="info_pagamento" style="display:none;">
    <img src="logo.png" style="width:80px;margin-top:20px;">
    <h3 id="descricao"></h3>
    <h3 id="valor"></h3>
  </div>

  <!-- QR CODE -->
  <div id="qrcode" style="margin-top:20px;"></div>

  <!-- PIX COPIA E COLA -->
  <div id="pixCopia" style="margin-top:20px;"></div>

  <!-- STATUS -->
  <div id="status" style="margin-top:20px;"></div>

</div>

<script>
// PARAMETROS URL
const params = new URLSearchParams(window.location.search);

const VALOR_URL = params.get("valor");
const DESCRICAO_URL = params.get("descricao");

// DEFINIÇÃO
let VALOR = VALOR_URL ? Number(VALOR_URL) : 10.00;
let DESCRICAO = DESCRICAO_URL ? DESCRICAO_URL : "Pagamento PIX";

// =========================
// CRIAR PAGAMENTO
// =========================
async function criarPagamento() {
  document.getElementById("loading").style.display = "block";

  const res = await fetch("/create-payment", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      transaction_amount: VALOR,
      payment_method_id: "pix",
      description: DESCRICAO,
      payer: {
        email: "teste@teste.com"
      }
    })
  });

  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  if (data.point_of_interaction) {

    const qr = data.point_of_interaction.transaction_data.qr_code;
    const copiaCola = data.point_of_interaction.transaction_data.qr_code;

    // QR
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), qr);

    // INFO
    document.getElementById("info_pagamento").style.display = "block";
    document.getElementById("descricao").innerText = DESCRICAO;
    document.getElementById("valor").innerText = "R$ " + VALOR;

    // PIX copia e cola
    document.getElementById("pixCopia").innerHTML = `
      <textarea id="pixTexto">${copiaCola}</textarea>
      <br><br>
      <button onclick="copiarPix()" class="btn btn-success">Copiar PIX</button>
    `;

    verificarPagamento(data.id);

  } else {
    alert("Erro ao gerar pagamento");
  }
}

// =========================
// COPIAR PIX
// =========================
function copiarPix() {
  const texto = document.getElementById("pixTexto");
  texto.select();
  document.execCommand("copy");
  alert("PIX copiado!");
}

// =========================
// VERIFICAR PAGAMENTO
// =========================
async function verificarPagamento(id) {
  const interval = setInterval(async () => {

    const res = await fetch("/check-payment/" + id);
    const data = await res.json();

    if (data.status === "approved") {
      clearInterval(interval);

      // mensagem + contador
      document.getElementById("status").innerHTML = `
        <h2>Pagamento aprovado ✅</h2>
        <p>Redirecionando para o chat...</p>
        <div class="contador" id="contador">10</div>
        <img src="check_ok.png" width="120">
      `;

      iniciarContador();
    }

  }, 5000);
}

// =========================
// CONTADOR
// =========================
function iniciarContador() {
  let tempo = 10;
  const contadorEl = document.getElementById("contador");

  const intervalo = setInterval(() => {
    tempo--;
    contadorEl.innerText = tempo;

    if (tempo <= 0) {
      clearInterval(intervalo);

      window.location.href = "https://tawk.to/chat/69ccd2878bf0a61c2cb9ba4f/1jl41coc1";
    }
  }, 1000);
}

// AUTO START
if (VALOR_URL) {
  criarPagamento();
}
</script>

</body>
</html>
