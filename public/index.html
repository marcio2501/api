<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento PIX</title>

  <!-- CSS -->
  <link href="bootstrap.min.css" rel="stylesheet">
  <link href="signin.css" rel="stylesheet">

  <!-- JS -->
  <script src="jquery-3.6.4.min.js"></script>
  <script src="qrcode.min.js"></script>

  <style>
    body { font-family: Arial; text-align:center; }
    #qrcode img { margin: 0 auto; padding: 5px 0; }
    textarea { resize:none; }
  </style>
</head>

<body>

<!-- LOADING -->
<div id="loading" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF;z-index:9999;padding-top:20px;">
  <img src="Loading_icon.gif" style="width:200px;">
</div>

<!-- CONTAINER -->
<div style="width:100%;max-width:500px;margin:0 auto;">

  <!-- INFO -->
  <div id="info_pagamento" style="display:none;">
    <img src="logo.png" style="width:80px;margin-top:20px;">
    <h3 id="descricao"></h3>
    <h3 id="valor"></h3>
  </div>

  <!-- QR CODE -->
  <div id="qrcode" style="margin-top:20px;"></div>

  <!-- PIX COPIA E COLA -->
  <div id="pixCopia" style="margin-top:20px;"></div>

  <!-- STATUS -->
  <div id="status" style="margin-top:20px;"></div>

</div>

<script>
// 🔥 PARAMETROS URL
const params = new URLSearchParams(window.location.search);

const VALOR_URL = params.get("valor");
const DESCRICAO_URL = params.get("descricao");

// 🔥 DEFINIÇÃO
let VALOR = VALOR_URL ? Number(VALOR_URL) : 10.00;
let DESCRICAO = DESCRICAO_URL ? DESCRICAO_URL : "Pagamento PIX";

// =========================
// CRIAR PAGAMENTO
// =========================
async function criarPagamento() {
  document.getElementById("loading").style.display = "block";

  const res = await fetch("/create-payment", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      transaction_amount: VALOR,
      payment_method_id: "pix",
      description: DESCRICAO,
      payer: {
        email: "teste@teste.com"
      }
    })
  });

  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  console.log(data);

  if (data.point_of_interaction) {

    const qr = data.point_of_interaction.transaction_data.qr_code;
    const copiaCola = data.point_of_interaction.transaction_data.qr_code;

    // QR CODE
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), qr);

    // INFO
    document.getElementById("info_pagamento").style.display = "block";
    document.getElementById("descricao").innerText = DESCRICAO;
    document.getElementById("valor").innerText = "R$ " + VALOR;

    // PIX COPIA E COLA
    document.getElementById("pixCopia").innerHTML = `
      <textarea id="pixTexto" style="width:100%;height:80px;">${copiaCola}</textarea>
      <br><br>
      <button onclick="copiarPix()" class="btn btn-success">Copiar PIX</button>
    `;

    verificarPagamento(data.id);

  } else {
    alert("Erro ao gerar pagamento");
  }
}

// =========================
// COPIAR PIX
// =========================
function copiarPix() {
  const texto = document.getElementById("pixTexto");
  texto.select();
  document.execCommand("copy");
  alert("PIX copiado!");
}

// =========================
// VERIFICAR PAGAMENTO
// =========================
async function verificarPagamento(id) {
  const interval = setInterval(async () => {

    const res = await fetch("/check-payment/" + id);
    const data = await res.json();

    console.log("Status:", data.status);

    if (data.status === "approved") {
      clearInterval(interval);

      document.getElementById("status").innerHTML = `
        <h2>Pagamento aprovado!</h2>
        <img src="check_ok.png" width="120">
      `;
    }

  }, 5000);
}

// 🔥 AUTO START
if (VALOR_URL) {
  criarPagamento();
}
</script>

</body>
</html>
