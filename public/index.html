<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento PIX</title>

  <link href="bootstrap.min.css" rel="stylesheet">
  <script src="qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;

      /* FUNDO DOURADO SUAVE */
      background: linear-gradient(135deg, #f7d774, #f2c94c, #d4af37);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container-pagamento {
      width: 95%;
      max-width: 380px;

      background: #fff;
      border-radius: 18px;
      padding: 18px 15px;

      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    img.logo {
      width: 65px;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 16px;
      margin: 5px 0;
      color: #333;
    }

    .valor {
      font-size: 22px;
      font-weight: bold;
      color: #111;
    }

    #qrcode canvas {
      width: 100% !important;
      max-width: 220px;
      margin: 10px auto;
    }

    textarea {
      width: 100%;
      height: 65px;
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 6px;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* CRONÔMETRO */
    .timer {
      font-size: 20px;
      font-weight: bold;
      color: #d32f2f;
      margin-top: 10px;
    }

    /* STATUS */
    #status h2 {
      font-size: 18px;
    }

    /* LOADING */
    #loading {
      display: none;
      position: fixed;
      background: rgba(255,255,255,0.95);
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      padding-top: 40%;
      text-align: center;
    }

  </style>
</head>

<body>

<div id="loading">
  <img src="Loading_icon.gif" width="120">
</div>

<div class="container-pagamento">

  <img src="logo.png" class="logo">

  <h3 id="descricao"></h3>
  <div class="valor" id="valor"></div>

  <!-- TIMER -->
  <div class="timer" id="timer">10:00</div>

  <div id="qrcode"></div>

  <div id="pixCopia"></div>

  <div id="status"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const VALOR = params.get("valor") ? Number(params.get("valor")) : 10.00;
const DESCRICAO = params.get("descricao") || "Pagamento PIX";

// =========================
// TIMER (10 minutos)
// =========================
let tempo = 600;

function iniciarTimer() {
  const el = document.getElementById("timer");

  const intervalo = setInterval(() => {
    tempo--;

    const min = Math.floor(tempo / 60);
    const sec = tempo % 60;

    el.innerText =
      String(min).padStart(2, '0') + ":" +
      String(sec).padStart(2, '0');

    if (tempo <= 0) {
      clearInterval(intervalo);
      el.innerText = "Expirado ❌";
    }

  }, 1000);
}

// =========================
// PAGAMENTO
// =========================
async function criarPagamento() {

  document.getElementById("loading").style.display = "block";

  const res = await fetch("/create-payment", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      transaction_amount: VALOR,
      payment_method_id: "pix",
      description: DESCRICAO,
      payer: { email: "teste@teste.com" }
    })
  });

  const data = await res.json();
  document.getElementById("loading").style.display = "none";

  if (data.point_of_interaction) {

    const qr = data.point_of_interaction.transaction_data.qr_code;

    new QRCode(document.getElementById("qrcode"), qr);

    document.getElementById("descricao").innerText = DESCRICAO;
    document.getElementById("valor").innerText = "R$ " + VALOR;

    document.getElementById("pixCopia").innerHTML = `
      <textarea id="pixTexto">${qr}</textarea>
      <button onclick="copiarPix()" class="btn btn-success">Copiar PIX</button>
    `;

    iniciarTimer();
    verificarPagamento(data.id);

  } else {
    alert("Erro ao gerar pagamento");
  }
}

// =========================
// COPIAR
// =========================
function copiarPix() {
  const t = document.getElementById("pixTexto");
  t.select();
  document.execCommand("copy");
  alert("PIX copiado!");
}

// =========================
// VERIFICAR
// =========================
async function verificarPagamento(id) {

  const interval = setInterval(async () => {

    const res = await fetch("/check-payment/" + id);
    const data = await res.json();

    if (data.status === "approved") {
      clearInterval(interval);

      document.getElementById("status").innerHTML = `
        <h2>Pagamento aprovado ✅</h2>
        <p>Redirecionando...</p>
      `;

      setTimeout(() => {
        window.location.href = "https://tawk.to/chat/69ccd2878bf0a61c2cb9ba4f/1jl41coc1";
      }, 3000);
    }

  }, 4000);
}

// START
criarPagamento();
</script>

</body>
</html>
